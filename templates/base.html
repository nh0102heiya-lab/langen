<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <meta name="theme-color" content="#f5f4ef">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">本文へ</a>
  <header class="site-header">
    <a class="wordmark" href="{{ get_url(path='@/_index.md') }}"><span class="mark">言</span><span>{{ config.title }}<small>CONSTRUCTED LANGUAGES</small></span></a>
    <nav aria-label="メインナビゲーション">
      <a href="{{ get_url(path='@/languages/_index.md') }}">言語一覧</a>
    </nav>
  </header>
  <main id="main">{% block content %}{% endblock content %}</main>
  <footer class="site-footer">
    <a class="wordmark" href="{{ get_url(path='@/_index.md') }}"><span class="mark">言</span><span>{{ config.title }}<small>LANGUAGE ARCHIVE</small></span></a>
    <p>{{ config.extra.site_description }}</p>
  </footer>
</body>
</html>
